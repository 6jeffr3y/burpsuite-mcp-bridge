# WSL NAT networking
# Burp runs on Windows, Codex/MCP runs inside WSL, but 127.0.0.1 is WSL itself.
# Replace 192.168.1.100 with the Windows LAN IP reachable from WSL.
# Bind the Burp HTTP bridge to the specific Windows interface reachable from WSL.
# Restrict the Windows firewall rule to the required WSL network; do not expose the bridge broadly.
[mcp_servers.burpsuite-mcp-bridge]
command = "python3"
args = ["/mnt/c/Tools/burpsuite-mcp-bridge/mcp-server/server.py"]

[mcp_servers.burpsuite-mcp-bridge.env]
BURP_MCP_BRIDGE_URL = "http://192.168.1.100:9639"
